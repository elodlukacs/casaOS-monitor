services:
  casaos-monitor:
    build: .
    container_name: casaos-monitor
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    environment:
      - PROC_PATH=/host/proc
      - SYS_PATH=/host/sys
      - HOST_ROOT=/host/root
      - PORT=3030
      # qBittorrent WebUI for the torrents panel (remove to hide it). No login is
      # sent: whitelist 172.16.0.0/12 under WebUI → "Bypass authentication for
      # clients in whitelisted IP subnets".
      - QBIT_URL=http://localhost:8181
      # Plex Media Server for the "now playing" panel (remove to hide it). Either
      # set PLEX_TOKEN, or add the address Plex sees under Settings → Network →
      # "List of IP addresses and networks that are allowed without auth":
      # the server's LAN IP for host-networked Plex, 172.16.0.0/255.240.0.0 for
      # bridge-networked. Don't use localhost/127.0.0.1: Plex classifies
      # loopback requests separately and ignores the list for them (401).
      - PLEX_URL=http://192.168.1.238:32400
      # token from a .env file next to this one (gitignored): PLEX_TOKEN=...
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      # Container panel, through the read-only proxy below.
      - DOCKER_HOST=tcp://127.0.0.1:2375
      # Extra browser origins allowed to connect, comma separated. Only needed
      # when the dashboard is opened through a reverse proxy or another host
      # name, e.g. https://monitor.example.com
      # - ALLOWED_ORIGINS=
      # Optional shared secret; open the page as http://<nas>:3030/?token=<value>.
      # The Android app cannot send a token, so it stops connecting while set.
      # - MONITOR_TOKEN=
    pid: host
    depends_on:
      - docker-proxy
    restart: unless-stopped

  # Gives the monitor container listing and stats, nothing else. Mounting
  # docker.sock into the monitor itself would give it full control of the
  # host: a :ro flag on a socket does not make the API read-only.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: casaos-monitor-docker-proxy
    environment:
      - CONTAINERS=1   # GET /containers/json and /containers/{id}/stats
      - POST=0         # GET/HEAD only (the default, spelled out)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"   # localhost only; never publish this port on the LAN
    restart: unless-stopped
