version: '3.8'

services:
  casaos-monitor:
    build: .
    container_name: casaos-monitor
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      # Docker Engine API for the container panel (GET only; read-only is enough)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PROC_PATH=/host/proc
      - SYS_PATH=/host/sys
      - HOST_ROOT=/host/root
      - PORT=3030
      # qBittorrent WebUI for the torrents panel (remove to hide it). No login is
      # sent: whitelist 172.16.0.0/12 under WebUI → "Bypass authentication for
      # clients in whitelisted IP subnets".
      - QBIT_URL=http://localhost:8181
      # Plex Media Server for the "now playing" panel (remove to hide it). Either
      # set PLEX_TOKEN, or add 172.16.0.0/12 (bridge-networked Plex) or
      # 127.0.0.1/32 (host-networked Plex) under Settings → Network → "List of
      # IP addresses and networks that are allowed without auth".
      - PLEX_URL=http://localhost:32400
      # - PLEX_TOKEN=
    pid: host
    restart: unless-stopped
